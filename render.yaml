# Render Blueprint for the RouteSync API (free tier).
# In Render: New > Blueprint > pick this repo. It reads this file and creates the
# service. Then set the secret env vars (DATABASE_URL, REDIS_URL) in the dashboard.
#
# Notes:
#  - `--include=dev` forces devDependencies (nest cli, typescript, prisma) to install
#    even though NODE_ENV=production, otherwise the build can't compile.
#  - Render injects PORT automatically; the app reads it (process.env.PORT).
#  - Free web services sleep after ~15 min idle and cold-start on the next request.
services:
  - type: web
    name: routesync-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Public origin of this service. The signed HLS gateway builds playback URLs from
      # it, so leaving it at the localhost default means players cannot reach the
      # playlists. Render exposes the service's own URL, which is exactly what's needed.
      - key: API_BASE_URL
        fromService:
          type: web
          name: routesync-api
          property: host
      # Secrets — set these in the Render dashboard (sync:false = not stored in git):
      - key: DATABASE_URL          # from Supabase (Postgres + PostGIS)
        sync: false
      - key: REDIS_URL             # from Upstash
        sync: false
      # Auto-generated strong secrets:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "2592000"
      # Phase 24: the media worker authenticates to /api/internal/* with this secret to
      # run R1 conformance on dashcam uploads. Generated here; copy the value into the
      # worker's own WORKER_SHARED_SECRET so the two match. Until they do, the internal
      # routes return 503 (closed by default — never anonymous).
      - key: WORKER_SHARED_SECRET
        generateValue: true
      # Object storage. NOTE: the API validates these at startup and WON'T BOOT if any
      # are missing — so we give placeholders here. They let the app start; real
      # uploads/video won't work until storage is configured. Browsing seeded routes
      # doesn't need them.
      #
      # To go live, add these four in the Render dashboard — they take precedence over the
      # placeholders below and derive the endpoint, so you don't edit this file:
      #   R2_ACCOUNT_ID, R2_ACCESS_KEY, R2_SECRET_KEY, R2_BUCKET
      # Set the same four on the worker so both services use the same bucket.
      - key: S3_ENDPOINT
        value: https://placeholder.r2.cloudflarestorage.com
      - key: S3_REGION
        # R2 requires the literal "auto" — a geographic region name is rejected by the
        # S3 signer, so uploads fail with a signature error rather than a clear message.
        value: auto
      - key: S3_BUCKET
        value: routesync-media
      - key: S3_ACCESS_KEY
        value: placeholder
      - key: S3_SECRET_KEY
        value: placeholder
      - key: S3_FORCE_PATH_STYLE
        # R2 accepts path-style as well as virtual-hosted, and MinIO requires it, so the
        # same value is correct in dev and production.
        value: "true"
      # A signed PUT is a write capability, so upload URLs expire far sooner than
      # playback URLs (15 minutes vs 1 hour).
      - key: UPLOAD_SIGNED_URL_TTL
        value: "900"
      # Thumbnails are the only asset class that may be served from a public CDN origin;
      # 'hls'/'master' are rejected at startup. Route video is paid content behind the
      # per-test-centre paywall and always goes through the signed HLS gateway, which
      # authorises each playlist/segment request before redirecting to storage.
      # R2_PUBLIC_URL is optional and only moves thumbnails to the edge.
      - key: CDN_PUBLIC_ASSETS
        value: thumbnail
