<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Test Routify">
  <defs>
    <linearGradient id="tr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#12325c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tr-bg)"/>
  <!-- winding route -->
  <path d="M120 400 C120 320 300 340 300 256 C300 176 392 190 392 120"
        fill="none" stroke="#3b82f6" stroke-width="30" stroke-linecap="round"
        stroke-dasharray="0 60 1000" opacity="0.55"/>
  <!-- start pin -->
  <circle cx="120" cy="400" r="26" fill="#34d399"/>
  <circle cx="120" cy="400" r="10" fill="#0b1f3a"/>
  <!-- end pin -->
  <circle cx="392" cy="120" r="26" fill="#60a5fa"/>
  <circle cx="392" cy="120" r="10" fill="#0b1f3a"/>
  <!-- TR monogram -->
  <text x="256" y="300" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif"
        font-size="200" font-weight="800" fill="#ffffff" letter-spacing="-8">TR</text>
</svg>
