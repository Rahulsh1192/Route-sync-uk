name: routesync
description: RouteSync — UK driving-route learning app (iOS & Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # networking & state
  dio: ^5.5.0
  provider: ^6.1.2
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2

  # media & maps
  video_player: ^2.9.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # practice-mode voice (UK English)
  flutter_tts: ^4.0.2

  # auth (mobile IAP + social sign-in)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  purchases_flutter: ^8.0.0   # RevenueCat IAP

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
