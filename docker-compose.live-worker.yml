# ── Worker on your machine, pointed at LIVE infrastructure ────────────────────
# Overlay for docker-compose.yml. Runs ONLY the worker container locally while it
# reads jobs from the live Redis, writes to the live Supabase database and the live
# R2 bucket. Costs nothing to host and picks up real uploads.
#
#   docker compose -f docker-compose.yml -f docker-compose.live-worker.yml \
#     --env-file services/worker/.env.live up --build --no-deps worker
#
# --no-deps is not optional: the base file makes `worker` depend on the local
# postgres/redis/minio containers, and without it Compose starts all three and the
# worker ends up half-wired to local infra it isn't reading from.
#
# This file is deliberately NOT named docker-compose.override.yml. An override is
# picked up automatically, so every plain `docker compose up` in this repo would
# silently point the worker at production. Naming it explicitly means live infra is
# something you opt into on the command line.
#
# Values come from --env-file, never from this file — nothing secret is committed.
# `:?` marks a variable as required: Compose refuses to start if it is missing,
# which is better than the worker booting with an empty value and failing later.
services:
  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in services/worker/.env.live}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in services/worker/.env.live}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL to the Render API URL}

      # Cloudflare R2. R2_ACCOUNT_ID derives the endpoint, so S3_ENDPOINT from the
      # base file is not used when these are set (see worker/config.py).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_BUCKET: ${R2_BUCKET:?}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?}
      # Blank for a normal bucket; "eu" if the bucket was created with EU data
      # residency, which puts it on a different hostname. Optional, unlike the rest:
      # `:-` supplies an empty default rather than demanding the variable exist.
      R2_JURISDICTION: ${R2_JURISDICTION:-}

      # Must be byte-identical to WORKER_SHARED_SECRET on the routesync-api service
      # in Render. Until it matches, uploads still process but /api/internal/* rejects
      # the worker, R1 conformance is skipped, and the route comes out flagged.
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?copy from Render → routesync-api → Environment}
