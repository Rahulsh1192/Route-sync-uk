# Serves the Test Routify web SPA (the admin console is a lazy /admin route
# inside it). Falls back to index.html so client-side routing (react-router-dom)
# works on deep links.

# Web app → http://localhost:5174
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
