# Serves the two RouteSync SPAs. Each listens on its own port and falls back to
# index.html so client-side routing (react-router-dom) works on deep links.

# Web app → http://localhost:5174
server {
    listen 5174;
    server_name _;
    root /usr/share/nginx/html/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Admin app → http://localhost:5180
server {
    listen 5180;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
