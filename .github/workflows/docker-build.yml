name: Docker Build & Push

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is set per-job from github.repository, lowercased — see the first step of
  # `build`. It cannot be set here because workflow-level `env:` cannot run shell, and
  # `github.repository` is "Rahulsh1192/Route-sync-uk": GHCR rejects any mixed-case
  # reference, which failed all three image builds on every push with
  # "invalid reference format: repository name must be lowercase".

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker
            dockerfile: services/worker/Dockerfile
          - name: frontends
            dockerfile: Dockerfile        # root Dockerfile builds the web app (admin is /admin inside it)

    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # Derived rather than hard-coded, so a rename or a fork still pushes to the right
      # namespace. `${VAR,,}` is bash lowercasing; the runner's default shell is bash.
      - name: Resolve the image namespace (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # One image repository per service, e.g. ghcr.io/owner/repo/api
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}:buildcache,mode=max
