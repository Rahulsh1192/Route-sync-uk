name: Deploy

# Runs only after "Docker Build & Push" completes successfully, so the images
# this deploy pulls are guaranteed to exist. (You cannot use `needs:` across
# workflows — that was the original bug — so we chain via workflow_run.)
on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (defaults to the branch name)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is set in the job below, lowercased — same constraint as docker-build.yml:
  # GHCR rejects a mixed-case reference and `github.repository` is "Rahulsh1192/Route-sync-uk".

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For workflow_run, only proceed if the upstream build actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Lifted to job level so the steps below can test them in `if:` conditions. The
    # `secrets` context is not available in an `if:`, but `env` is — which is what makes
    # "deploy only when a target is actually configured" expressible at all.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image namespace (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # docker-build tags images with the branch name (type=ref,event=branch),
      # so the deployable tag is the branch that triggered the build.
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          TAG="${TAG:-master}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      # Without this guard the job failed on every successful build: with no DEPLOY_* secrets
      # set, `ssh-keyscan -H ""` and then `ssh @` exit non-zero, and the run went red for a
      # deployment that was never configured rather than one that went wrong. A pipeline that
      # is always red tells you nothing on the day something real breaks.
      - name: Check whether a deploy target is configured
        id: target
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — no SSH target configured"
              echo ""
              echo 'This workflow deploys by SSH-ing into a host and running `docker compose`'
              echo 'in `/app`. It needs the `DEPLOY_HOST`, `DEPLOY_USER` and `DEPLOY_KEY`'
              echo 'repository secrets, none of which are set.'
              echo ""
              echo 'The images built fine and are published to'
              echo "\`ghcr.io/${IMAGE_NAME}/{api,worker,frontends}:${{ steps.tag.outputs.tag }}\`."
              echo ""
              echo 'If the API is deployed by the Render blueprint in `render.yaml`, Render'
              echo 'builds from the repository on push and this workflow is redundant —'
              echo 'delete it rather than leaving it to skip forever.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to staging
        if: steps.target.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # The remote /app/docker-compose.yml is expected to reference the three
          # images by tag, e.g.  image: ghcr.io/${IMAGE_NAME}/api:${IMAGE_TAG}
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /app && IMAGE_TAG='$IMAGE_TAG' docker compose pull && IMAGE_TAG='$IMAGE_TAG' docker compose up -d"

      - name: Health check
        if: steps.target.outputs.configured == 'true'
        run: |
          # API listens on 3000 with a global "api" prefix → /api/health
          for i in $(seq 1 30); do
            if curl -fsS "http://$DEPLOY_HOST:3000/api/health"; then
              echo "✅ Deployment healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Health check failed"
          exit 1

      # Both notify steps also need the webhook to exist: the Slack action fails with
      # "Need to provide at least one botToken or webhookUrl", which turned the failure
      # notifier into a second, more confusing failure of its own.
      - name: Notify Slack on success
        if: success() && steps.target.outputs.configured == 'true' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "✅ RouteSync deployment successful (tag ${{ steps.tag.outputs.tag }})"
            }

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "❌ RouteSync deployment failed (tag ${{ steps.tag.outputs.tag }})"
            }
        # No step-level env needed: SLACK_WEBHOOK_URL is set for the whole job above, which
        # is also what lets the `if:` above test it.
